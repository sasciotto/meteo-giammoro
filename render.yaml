services:
  - type: cron
    name: meteo-giammoro-external-watchdog
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: "python external_scheduler.py"
    envVars:
      - key: METEO_GITHUB_TOKEN
        sync: false
      - key: METEO_STALE_MINUTES
        value: "15"
      - key: METEO_GITHUB_OWNER
        value: sasciotto
      - key: METEO_GITHUB_REPO
        value: meteo-giammoro
      - key: METEO_GITHUB_REF
        value: main
      - key: METEO_GITHUB_WORKFLOW
        value: update-weather.yml
      - key: METEO_DATA_URL
        value: https://sasciotto.github.io/meteo-giammoro/data.json
