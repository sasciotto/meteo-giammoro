name: Upgrade dashboard tracking

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upgrade-dashboard-tracking.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggiorna dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def repl(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Pattern non trovato: {label}')
              s = s.replace(old, new, 1)

          repl(
            '.beginner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.beginner-card{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:14px}.beginner-card b{display:block;font-size:17px;margin-top:4px}.beginner-text{font-size:16px;line-height:1.6}.station-grid',
            '.beginner-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.beginner-card{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:14px}.beginner-card b{display:block;font-size:17px;margin-top:4px}.beginner-text{font-size:16px;line-height:1.6}.confidence-bar{height:9px;border-radius:999px;background:#e6ecef;overflow:hidden;margin:10px 0 5px}.confidence-fill{height:100%;background:var(--accent);width:0;transition:width .25s ease}.tracking-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.tracking-note{margin-top:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:11px}.station-grid',
            'css tracking'
          )

          repl(
            '''      <div class="beginner-card"><div class="k">Prossime 3–48 ore</div><b id="simpleRisk">—</b><span class="small muted" id="simpleRiskNote"></span></div>\n    </div>''',
            '''      <div class="beginner-card"><div class="k">Prossime 3–48 ore</div><b id="simpleRisk">—</b><span class="small muted" id="simpleRiskNote"></span></div>\n      <div class="beginner-card"><div class="k">Confidenza analisi</div><b id="simpleConfidence">—</b><span class="small muted" id="simpleConfidenceNote">Qualità complessiva del nowcasting</span></div>\n    </div>''',
            'card confidenza principiante'
          )

          repl(
            '''</section>\n\n<section class="section card beginner-only">\n  <div class="section-title"><h2>Allerta ufficiale</h2>''',
            '''</section>\n\n<section class="section grid two expert-only">\n  <div class="card">\n    <div class="section-title"><h2>Tracking radar</h2><span class="badge unknown" id="trackingStatus">—</span></div>\n    <div class="tracking-grid" id="trackingMetrics"></div>\n    <div class="tracking-note" id="trackingNote">—</div>\n  </div>\n  <div class="card">\n    <div class="section-title"><h2>Confidenza nowcasting</h2><span class="badge unknown" id="confidenceBadge">—</span></div>\n    <div class="v" id="confidenceScore">—</div>\n    <div class="confidence-bar"><div class="confidence-fill" id="confidenceFill"></div></div>\n    <div class="small muted" id="confidenceNote"></div>\n    <div class="tracking-grid" id="confidenceComponents"></div>\n  </div>\n</section>\n\n<section class="section card beginner-only">\n  <div class="section-title"><h2>Allerta ufficiale</h2>''',
            'sezione tracking esperto'
          )

          repl(
            '''</section>\n\n<section class="section card">\n  <div class="section-title"><h2>Ultimo cambiamento significativo</h2>''',
            '''</section>\n\n<section class="section card beginner-only">\n  <div class="section-title"><h2>Radar vicino a Giammoro</h2><span class="badge unknown" id="simpleTrackingStatus">—</span></div>\n  <div class="beginner-text" id="simpleTracking">—</div>\n</section>\n\n<section class="section card">\n  <div class="section-title"><h2>Ultimo cambiamento significativo</h2>''',
            'tracking principiante'
          )

          repl(
            '''const safeUrl=u=>{try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:null}catch{return null}};''',
            '''const safeUrl=u=>{try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:null}catch{return null}};\nconst confClass=label=>{const x=String(label||'').toLowerCase();return x.includes('alta')?'online':x.includes('media')?'warning':x.includes('bassa')?'elevato':'unknown'};\nconst trackingLabel=t=>{if(t?.status==='detected')return 'Nucleo rilevato';if(t?.status==='no_cell')return 'Nessun nucleo';if(t?.status==='no_data')return 'Dati radar assenti';return 'Non disponibile'};\nconst trackingClass=t=>t?.status==='detected'?'warning':t?.status==='no_cell'?'online':'unknown';''',
            'helper js'
          )

          repl(
            '''  $('nowcast').innerHTML=badge(d.nowcast?.label,d.nowcast?.level);$('nowcastNote').textContent=d.nowcast?.note||'';$('risk').innerHTML=badge(d.risk_48h?.label,d.risk_48h?.level);$('riskNote').textContent=d.risk_48h?.note||'';const ps=d.primary_station||{};$('primaryStation').innerHTML=badge(ps.status_label,ps.status);$('primaryStationNote').textContent=ps.note||'';''',
            '''  $('nowcast').innerHTML=badge(d.nowcast?.label,d.nowcast?.level);$('nowcastNote').textContent=d.nowcast?.note||'';$('risk').innerHTML=badge(d.risk_48h?.label,d.risk_48h?.level);$('riskNote').textContent=d.risk_48h?.note||'';const ps=d.primary_station||{};$('primaryStation').innerHTML=badge(ps.status_label,ps.status);$('primaryStationNote').textContent=ps.note||'';\n  const tr=d.nowcast_tracking||{};const mo=tr.motion||{};const cf=d.analysis_confidence||{};const cell=tr.cell||{};\n  $('trackingStatus').className='badge '+trackingClass(tr);$('trackingStatus').textContent=trackingLabel(tr);$('simpleTrackingStatus').className='badge '+trackingClass(tr);$('simpleTrackingStatus').textContent=trackingLabel(tr);\n  const trackMetrics=[];if(tr.status==='detected'){trackMetrics.push(metric('Distanza',cell.distance_km,' km',cell.bearing?('direzione '+cell.bearing):''));trackMetrics.push(metric('Picco radar',tr.peak_value,' '+(tr.unit||''),tr.product||''));trackMetrics.push(metric('Età dato',tr.age_minutes,' min',tr.timestamp||''));if(mo.status==='tracked'){trackMetrics.push(metric('Velocità',mo.speed_kmh,' km/h',mo.direction||''));trackMetrics.push(metric('Avvicinamento',mo.approach_rate_kmh,' km/h',mo.approaching?'verso Giammoro':'non diretto'));trackMetrics.push(metric('ETA',mo.eta_minutes,' min','entro 5 km'));trackMetrics.push(metric('Min. distanza',mo.closest_approach_km,' km',mo.closest_approach_minutes==null?'':('tra '+mo.closest_approach_minutes+' min')));}}\n  $('trackingMetrics').innerHTML=trackMetrics.join('')||'<div class="empty">Tracking non disponibile.</div>';\n  let trackNote='Tracking non disponibile.';if(tr.status==='no_cell')trackNote='Nessun nucleo radar sufficientemente definito nel raggio analizzato.';else if(tr.status==='detected'&&mo.status!=='tracked')trackNote=`Nucleo radar a circa ${cell.distance_km??'—'} km ${cell.bearing||''} di Giammoro. Movimento non ancora stimabile: serve un secondo frame coerente.`;else if(tr.status==='detected'&&mo.status==='tracked'){trackNote=`Nucleo a ${cell.distance_km??'—'} km ${cell.bearing||''}; movimento ${mo.direction||'—'} a ~${mo.speed_kmh??'—'} km/h.`+(mo.eta_minutes!=null?` Possibile ingresso entro 5 km in ~${mo.eta_minutes} min.`:(mo.approaching?` In avvicinamento; minima distanza proiettata ~${mo.closest_approach_km??'—'} km.`:' Traiettoria non diretta verso Giammoro.'));}$('trackingNote').textContent=trackNote;$('simpleTracking').textContent=trackNote;\n  $('confidenceBadge').className='badge '+confClass(cf.label);$('confidenceBadge').textContent=cf.label||'—';$('confidenceScore').textContent=cf.score==null?'—':`${cf.score}/100`;$('confidenceFill').style.width=Math.max(0,Math.min(100,Number(cf.score)||0))+'%';$('confidenceNote').textContent=cf.note||'';$('simpleConfidence').textContent=cf.score==null?(cf.label||'—'):`${cf.label||'—'} · ${cf.score}/100`;\n  const cc=cf.components||{};$('confidenceComponents').innerHTML=[metric('Freschezza radar',cc.radar_freshness,' pt'),metric('Rilevamento cella',cc.cell_detection,' pt'),metric('Tracking moto',cc.motion_tracking,' pt'),metric('Cross-check radar',cc.radar_crosscheck,' pt'),metric('Stazioni',cc.station_support,' pt'),metric('Modelli',cc.model_availability,' pt')].join('');''',
            'render tracking js'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verifica HTML e JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="trackingStatus"' in s
          assert 'id="simpleConfidence"' in s
          assert 'analysis_confidence' in s
          a=s.index('<script>')+len('<script>')
          b=s.index('</script>',a)
          Path('/tmp/dashboard.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Commit e pulizia workflow temporaneo
        shell: bash
        run: |
          git config user.name "meteo-giammoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/upgrade-dashboard-tracking.yml
          git add index.html .github/workflows/upgrade-dashboard-tracking.yml
          git commit -m "Mostra tracking radar e confidenza in dashboard"
          git push
