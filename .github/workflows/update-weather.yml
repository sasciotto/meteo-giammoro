name: Aggiorna Meteo Giammoro

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "collector.py"
      - "home_forecast.py"
      - "nowcast_engine.py"
      - "nowcast_v2.py"
      - "nowcast_v4.py"
      - "lightning_eumetsat.py"
      - "verification_engine.py"
      - "verification_engine_v2.py"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-giammoro-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Conserva ciclo precedente
        run: cp data.json /tmp/data-previous.json

      - name: Aggiorna dati base
        run: python collector.py

      - name: Tracking multi-cella, multi-frame e fulminazioni
        run: python nowcast_v4.py --data data.json --previous /tmp/data-previous.json --history history.json

      - name: Sintesi home e previsione breve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector
          import home_forecast
          p=Path('data.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data=home_forecast.apply(data, collector)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verifica ex-post e archivio eventi
        run: python verification_engine_v2.py --data data.json --verification verification.json --events events.json

      - name: Prepara sito
        run: |
          rm -rf _site
          mkdir _site
          cp index.html data.json history.json verification.json events.json .nojekyll _site/

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Salva dati aggiornati nel repository
        run: |
          if git diff --quiet -- data.json history.json verification.json events.json; then
            echo "Nessuna modifica ai dati"
            exit 0
          fi

          git config user.name "meteo-giammoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json verification.json events.json
          git commit -m "Aggiorna dati meteo, tracking, home e verifica ex-post"

          for attempt in 1 2 3; do
            if git push; then
              echo "Persistenza dati completata al tentativo ${attempt}"
              exit 0
            fi

            echo "Push rifiutato al tentativo ${attempt}: riallineo main e riprovo"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::Conflitto durante il rebase: Pages è già aggiornata, salto la persistenza di questo ciclo"
              git rebase --abort || true
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "::warning::Pages è aggiornata ma non è stato possibile persistere i file dati dopo 3 tentativi"
          exit 0

# Scheduler principale: ogni 15 minuti ai minuti :07, :22, :37 e :52.
# I minuti sono sfalsati dall'inizio dell'ora per ridurre il rischio di ritardi dovuti al carico GitHub Actions.
# Trigger concorrenti vengono accodati, non cancellano un collector già in esecuzione.
# Pages viene pubblicata prima della persistenza su main, così un conflitto Git non rende obsoleta la dashboard.
# Il push dati effettua fetch/rebase/retry automatico fino a 3 tentativi.
# Fulminazioni: EUMETSAT MTG Lightning Imager L2 Lightning Flashes, opzionale via GitHub Secrets.
# Verifica ex-post: orizzonti 30/60/120 min; hazard locale separato dal track radar.
# Home: sintesi deterministica backend + previsione oraria/oggi-domani.
# LTG/LAMPINET non è attualmente esposto tra i productType supportati dalla REST API Radar-DPC v2.
