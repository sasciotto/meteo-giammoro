name: Aggiorna Meteo Giammoro

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "data.json"
      - "history.json"
      - "collector.py"
      - "nowcast_engine.py"
      - "nowcast_v2.py"
      - "tests/**"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-giammoro-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Conserva ciclo precedente
        run: cp data.json /tmp/data-previous.json

      - name: Aggiorna dati base
        run: python collector.py

      - name: Tracking multi-cella, multi-frame e fulminazioni
        run: python nowcast_v2.py --data data.json --previous /tmp/data-previous.json --history history.json

      - name: Salva dati aggiornati nel repository
        run: |
          if git diff --quiet -- data.json history.json; then
            echo "Nessuna modifica ai dati"
          else
            git config user.name "meteo-giammoro-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json history.json
            git commit -m "Aggiorna dati meteo, tracking e fulminazioni"
            git push
          fi

      - name: Prepara sito
        run: |
          rm -rf _site
          mkdir _site
          cp index.html data.json history.json .nojekyll _site/

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Il deploy espone tracking radar multi-cella, confidence score e LTG/LAMPINET.
