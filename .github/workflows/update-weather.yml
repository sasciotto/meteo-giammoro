name: Aggiorna Meteo Giammoro

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "forecast_dashboard.js"
      - "approaching_cells_ui.js"
      - "analysis_quality.py"
      - "analysis_quality_update.py"
      - "analysis_quality_ui.js"
      - "verification_history.py"
      - "verification_history_ui.js"
      - "precipitation_verification.py"
      - "station_fallback.py"
      - "radar_ui.js"
      - "site_prepare.py"
      - "solar_monitoring.py"
      - "ground_solar.py"
      - "solar_monitoring_ui.js"
      - "collector.py"
      - "home_forecast.py"
      - "home_forecast_v2.py"
      - "model_outlook.py"
      - "runtime_quality.py"
      - "nowcast_engine.py"
      - "nowcast_v2.py"
      - "nowcast_v4.py"
      - "approaching_cells.py"
      - "lightning_eumetsat.py"
      - "quality_guard.py"
      - "verification_engine.py"
      - "verification_engine_v2.py"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-giammoro-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      LSASAF_USERNAME: ${{ secrets.LSASAF_USERNAME }}
      LSASAF_PASSWORD: ${{ secrets.LSASAF_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica aggiornamento necessario
        id: freshness
        run: |
          set -euo pipefail
          git fetch origin data-state || true
          SHOULD_RUN=true
          if git show-ref --verify --quiet refs/remotes/origin/data-state; then
            LAST_DATA_TS=$(git show -s --format=%ct origin/data-state)
            NOW_TS=$(date +%s)
            AGE=$((NOW_TS - LAST_DATA_TS))
            if [ "$AGE" -lt 540 ]; then
              SHOULD_RUN=false
              echo "Ultimo ciclo dati ${AGE}s fa: salto questo run ridondante."
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Configura Python
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        if: steps.freshness.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Test
        if: steps.freshness.outputs.should_run == 'true'
        run: pytest -q

      - name: Recupera ciclo precedente
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          git show origin/data-state:data.json > /tmp/data-previous.json 2>/dev/null || cp data.json /tmp/data-previous.json
          git show origin/data-state:history.json > /tmp/history-previous.json 2>/dev/null || cp history.json /tmp/history-previous.json
          git show origin/data-state:verification.json > /tmp/verification-previous.json 2>/dev/null || cp verification.json /tmp/verification-previous.json
          git show origin/data-state:events.json > /tmp/events-previous.json 2>/dev/null || cp events.json /tmp/events-previous.json
          git show origin/data-state:seismic_events.json > /tmp/seismic-previous.json 2>/dev/null || cp seismic_events.json /tmp/seismic-previous.json

      - name: Aggiorna dati meteo base
        if: steps.freshness.outputs.should_run == 'true'
        run: python collector.py

      - name: Aggiorna monitoraggio solare LSA SAF
        if: steps.freshness.outputs.should_run == 'true'
        run: python solar_monitoring.py --data data.json --previous /tmp/data-previous.json

      - name: Aggiorna tracking fenomeni
        if: steps.freshness.outputs.should_run == 'true'
        run: python nowcast_v4.py

      - name: Aggiorna qualita analisi
        if: steps.freshness.outputs.should_run == 'true'
        run: python analysis_quality_update.py

      - name: Aggiorna previsione home
        if: steps.freshness.outputs.should_run == 'true'
        run: python home_forecast_v2.py

      - name: Aggiorna qualita runtime
        if: steps.freshness.outputs.should_run == 'true'
        run: python runtime_quality.py

      - name: Aggiorna verifica ex-post
        if: steps.freshness.outputs.should_run == 'true'
        run: python verification_engine_v2.py

      - name: Aggiorna verifica cumulativa
        if: steps.freshness.outputs.should_run == 'true'
        run: python verification_history.py

      - name: Aggiorna verifica precipitazioni
        if: steps.freshness.outputs.should_run == 'true'
        run: python precipitation_verification.py

      - name: Ricalibra qualita analisi
        if: steps.freshness.outputs.should_run == 'true'
        run: python analysis_quality_update.py

      - name: Prepara sito
        if: steps.freshness.outputs.should_run == 'true'
        run: python site_prepare.py

      - name: Configura Pages
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Carica artifact Pages
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica GitHub Pages
        if: steps.freshness.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Salva dati persistenti
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/persist
          cp data.json history.json verification.json events.json seismic_events.json /tmp/persist/
          git fetch origin data-state || true
          if git show-ref --verify --quiet refs/remotes/origin/data-state; then
            git switch -C data-state origin/data-state
          else
            git switch --orphan data-state
            git rm -rf . || true
          fi
          cp /tmp/persist/* .
          git add data.json history.json verification.json events.json seismic_events.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "meteo-giammoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna dati meteo, tracking, home, eventi e verifica ex-post"
          git push origin data-state
