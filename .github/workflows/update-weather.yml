name: Aggiorna Meteo Giammoro

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "forecast_dashboard.js"
      - "approaching_cells_ui.js"
      - "analysis_quality.py"
      - "analysis_quality_update.py"
      - "analysis_quality_ui.js"
      - "site_prepare.py"
      - "collector.py"
      - "home_forecast.py"
      - "home_forecast_v2.py"
      - "runtime_quality.py"
      - "nowcast_engine.py"
      - "nowcast_v2.py"
      - "nowcast_v4.py"
      - "approaching_cells.py"
      - "lightning_eumetsat.py"
      - "quality_guard.py"
      - "verification_engine.py"
      - "verification_engine_v2.py"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-giammoro-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica se serve un nuovo ciclo
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Push di codice/configurazione: eseguo sempre il ciclo"
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          should_run = True
          age = 9999
          try:
              data = json.loads(Path('data.json').read_text(encoding='utf-8'))
              raw = (data.get('meta') or {}).get('last_check_iso')
              if raw:
                  dt = datetime.fromisoformat(raw)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  age = max(0, int((datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60))
                  should_run = age >= 10
          except Exception:
              should_run = True

          print(f"age_minutes={age}")
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Mostra decisione ciclo
        if: github.event_name != 'push'
        run: echo "Età dati = ${{ steps.freshness.outputs.age_minutes }} min; esegui = ${{ steps.freshness.outputs.should_run }}"

      - name: Python
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        if: steps.freshness.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Test
        if: steps.freshness.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Conserva ciclo precedente
        if: steps.freshness.outputs.should_run == 'true'
        run: cp data.json /tmp/data-previous.json

      - name: Aggiorna dati base e conserva cache modelli
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector

          original_fetch_json = collector.fetch_json
          model_cache = {}

          def caching_fetch_json(url, params, timeout=30):
              raw = original_fetch_json(url, params, timeout)
              model_id = str((params or {}).get('models') or '')
              if url == collector.OPEN_METEO and model_id:
                  model_cache[model_id] = raw
              return raw

          collector.fetch_json = caching_fetch_json
          rc = collector.main()
          Path('/tmp/open-meteo-model-cache.json').write_text(
              json.dumps(model_cache, ensure_ascii=False), encoding='utf-8'
          )
          if rc:
              raise SystemExit(rc)
          print(f"Modelli deterministici conservati in cache: {len(model_cache)}")
          PY

      - name: Tracking multi-cella, multi-frame e fulminazioni
        if: steps.freshness.outputs.should_run == 'true'
        run: python nowcast_v4.py --data data.json --previous /tmp/data-previous.json --history history.json

      - name: Separa qualità dati e affidabilità traiettoria
        if: steps.freshness.outputs.should_run == 'true'
        run: python analysis_quality_update.py --data data.json

      - name: Sintesi home e previsione breve
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector
          import home_forecast_v2 as home_forecast

          cache_path = Path('/tmp/open-meteo-model-cache.json')
          model_cache = json.loads(cache_path.read_text(encoding='utf-8')) if cache_path.exists() else {}
          original_fetch_json = collector.fetch_json

          def reuse_fetch_json(url, params, timeout=30):
              model_id = str((params or {}).get('models') or '')
              if url == collector.OPEN_METEO and model_id in model_cache:
                  print(f"Riutilizzo cache Open-Meteo per {model_id}")
                  return model_cache[model_id]
              return original_fetch_json(url, params, timeout)

          collector.fetch_json = reuse_fetch_json
          p = Path('data.json')
          previous_path = Path('/tmp/data-previous.json')
          previous = json.loads(previous_path.read_text(encoding='utf-8')) if previous_path.exists() else {}
          data = json.loads(p.read_text(encoding='utf-8'))
          data = home_forecast.apply(data, collector, previous=previous)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Normalizza qualità runtime e allerte
        if: steps.freshness.outputs.should_run == 'true'
        run: python runtime_quality.py --data data.json

      - name: Verifica ex-post e archivio eventi
        if: steps.freshness.outputs.should_run == 'true'
        run: python verification_engine_v2.py --data data.json --verification verification.json --events events.json

      - name: Aggiorna stato calibrazione previsionale
        if: steps.freshness.outputs.should_run == 'true'
        run: python analysis_quality_update.py --data data.json

      - name: Prepara sito con previsione
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          rm -rf _site
          mkdir _site
          cp forecast_dashboard.js data.json history.json verification.json events.json .nojekyll _site/
          python site_prepare.py --source index.html --dest _site/index.html

      - name: Configura GitHub Pages
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Carica artifact Pages
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica GitHub Pages
        if: steps.freshness.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Salva dati aggiornati nel repository
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- data.json history.json verification.json events.json; then
            echo "Nessuna modifica ai dati"
            exit 0
          fi

          git config user.name "meteo-giammoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json verification.json events.json
          git commit -m "Aggiorna dati meteo, tracking, home e verifica ex-post"

          for attempt in 1 2 3; do
            if git push; then
              echo "Persistenza dati completata al tentativo ${attempt}"
              exit 0
            fi

            echo "Push rifiutato al tentativo ${attempt}: riallineo main e riprovo"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::Conflitto durante il rebase: Pages è già aggiornata, salto la persistenza di questo ciclo"
              git rebase --abort || true
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "::warning::Pages è aggiornata ma non è stato possibile persistere i file dati dopo 3 tentativi"
          exit 0

# Heartbeat auto-rilanciante: richiama workflow_dispatch ogni 15 minuti senza dipendere dal cron GitHub.
# Scheduler GitHub di backup: ogni 15 minuti ai minuti :07, :22, :37 e :52.
# La guardia iniziale evita di eseguire il collector se i dati hanno meno di 10 minuti.
# Le risposte Open-Meteo deterministiche del collector vengono riutilizzate dalla home senza una seconda richiesta.
# Se il modello home fallisce, viene mantenuta fino a 6 h l'ultima previsione valida, marcata come dato precedente.
# Il collector viene marcato degraded quando la previsione modellistica home non è disponibile.
# La pagina pubblica usa un solo fetch di data.json; forecast_dashboard.js riceve lo stesso oggetto dati.
# Trigger concorrenti vengono accodati, non cancellano un collector già in esecuzione.
# Pages viene pubblicata prima della persistenza su main, così un conflitto Git non rende obsoleta la dashboard.
# Il push dati effettua fetch/rebase/retry automatico fino a 3 tentativi.
# Fulminazioni: EUMETSAT MTG Lightning Imager L2 Lightning Flashes, opzionale via GitHub Secrets.
# Verifica ex-post: orizzonti 30/60/120 min; hazard locale separato dal track radar.
# Qualità tecnica e affidabilità traiettoria sono separate dalla confidenza probabilistica, che resta non calibrata.
# Home: sintesi deterministica backend + previsione oraria/oggi-domani + consenso multi-modello.
# LTG/LAMPINET non è attualmente esposto tra i productType supportati dalla REST API Radar-DPC v2.
