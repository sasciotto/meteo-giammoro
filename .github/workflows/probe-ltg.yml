name: Probe LTG Radar-DPC

on:
  push:
    paths:
      - ".github/workflows/probe-ltg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prova downloadProduct LTG
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, subprocess
          now=datetime.datetime.now(datetime.timezone.utc).replace(second=0,microsecond=0)
          base=now.replace(minute=(now.minute//10)*10)
          for i in range(0,10):
              t=base-datetime.timedelta(minutes=10*i)
              ms=int(t.timestamp()*1000)
              body=json.dumps({"productType":"LTG","productDate":ms})
              cmd=["curl","-sS","-w","\nHTTP_STATUS:%{http_code}\n","-X","POST","https://radar-api.protezionecivile.it/downloadProduct","-H","origin: https://radar.protezionecivile.it","-H","referer: https://radar.protezionecivile.it/","-H","content-type: application/json","--data",body]
              out=subprocess.run(cmd,capture_output=True,text=True,timeout=25)
              print("\n---",t.isoformat(),ms,"---")
              print((out.stdout or out.stderr)[:1200])
          PY
