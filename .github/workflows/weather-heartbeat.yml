name: Heartbeat Meteo Giammoro

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: meteo-giammoro-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avvia aggiornamento meteo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-weather.yml/dispatches \
              -d '{"ref":"main"}'; then
              echo "Aggiornamento meteo richiesto"
              exit 0
            fi
            echo "Tentativo ${attempt} fallito, riprovo"
            sleep $((attempt * 10))
          done

          echo "::error::Impossibile avviare update-weather.yml dopo 3 tentativi"
          exit 1

# Heartbeat manuale one-shot: non mantiene più un runner occupato per 15 minuti.
# La cadenza automatica resta affidata allo schedule di update-weather.yml (:07, :22, :37, :52).
# La guardia di freschezza del workflow principale evita cicli duplicati quando cron e avvio manuale si sovrappongono.
