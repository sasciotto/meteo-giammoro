name: Heartbeat Meteo Giammoro

on:
  workflow_dispatch:
  schedule:
    - cron: "14,29,44,59 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weather-heartbeat.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: meteo-giammoro-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Controlla aggiornamenti già in corso
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-weather.yml/runs?per_page=10")

          active=$(printf '%s' "$payload" | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
          echo "active=${active}" >> "$GITHUB_OUTPUT"
          if [ "$active" -gt 0 ]; then
            echo "Un aggiornamento meteo è già queued/in_progress: nessun dispatch duplicato"
          else
            echo "Nessun aggiornamento attivo: il watchdog può richiedere un nuovo ciclo"
          fi

      - name: Avvia aggiornamento meteo se necessario
        if: steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-weather.yml/dispatches \
              -d '{"ref":"main"}'; then
              echo "Aggiornamento meteo richiesto dal watchdog"
              exit 0
            fi
            echo "Tentativo ${attempt} fallito, riprovo"
            sleep $((attempt * 10))
          done

          echo "::error::Impossibile avviare update-weather.yml dopo 3 tentativi"
          exit 1

# Watchdog ridondante one-shot: non mantiene runner in sleep.
# Il workflow principale resta schedulato ai minuti :07, :22, :37, :52.
# Il watchdog prova ai minuti :14, :29, :44, :59, sette minuti dopo ogni slot principale.
# Se un update è già queued/in_progress non genera duplicati.
# Se il cron principale è stato saltato, il watchdog effettua workflow_dispatch.
# Se i dati sono ancora freschi, la guardia iniziale di update-weather.yml interrompe il ciclo senza collector.
# Il trigger push sul solo file heartbeat permette di testare immediatamente ogni modifica a questa logica.
