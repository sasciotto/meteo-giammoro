name: Verifica codice METEO Giammoro

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "index.html"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "index.html"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meteo-giammoro-code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Suite completa
        run: python -m pytest -q
