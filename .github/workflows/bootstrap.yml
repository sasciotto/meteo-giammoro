name: Bootstrap Meteo Giammoro

on:
  workflow_dispatch:
  push:
    paths:
      - "bootstrap.b64"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: |
          set -euo pipefail
          base64 -d bootstrap.b64 > /tmp/meteo-giammoro.zip
          mkdir -p /tmp/meteo-unpack
          unzip -q /tmp/meteo-giammoro.zip -d /tmp/meteo-unpack
          cp -a /tmp/meteo-unpack/meteo-giammoro/. .
          rm -f bootstrap.b64
          rm -f .github/workflows/bootstrap.yml

      - name: Verifica test
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Commit progetto completo
        run: |
          git config user.name "meteo-giammoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pubblica dashboard Meteo Giammoro 2.1"
          git push

# Trigger bootstrap after workflow registration.
