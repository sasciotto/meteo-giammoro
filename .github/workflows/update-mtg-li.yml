name: Aggiorna fulminazioni MTG-LI (indipendente)

on:
  workflow_dispatch:
  # GitHub scheduled jobs can be delayed or skipped. Refresh satellite
  # observations after a successful meteorological workflow as well.
  workflow_run:
    workflows: ["Aggiorna Meteo Giammoro"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "lightning_mtg_li.py"
      - ".github/workflows/update-mtg-li.yml"
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

concurrency:
  group: meteo-giammoro-mtg-li
  cancel-in-progress: false

jobs:
  collect-mtg-li:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evita acquisizioni satellitari duplicate con snapshot recente
        id: freshness
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          reuse = False
          try:
              data = json.loads(Path("lightning_mtg_li.json").read_text(encoding="utf-8"))
              def age_minutes(value):
                  stamp = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      return None
                  return (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds() / 60
              observation_age = age_minutes(data.get("observed_at"))
              retrieval_age = age_minutes(data.get("retrieved_at"))
              reuse = (
                  data.get("status") == "ok"
                  and observation_age is not None and 0 <= observation_age <= 30
                  and retrieval_age is not None and 0 <= retrieval_age <= 8
              )
          except (OSError, ValueError, TypeError, KeyError):
              pass
          print(f"should_collect={'false' if reuse else 'true'}")
          PY
      - name: Python
        if: steps.freshness.outputs.should_collect == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze MTG-LI
        if: steps.freshness.outputs.should_collect == 'true'
        run: pip install "numpy>=2,<3" "eumdac>=3.1,<4" "netCDF4>=1.7,<2"
      - name: Raccolta MTG-LI con limite rigido
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        run: |
          # Accesso satellitare isolato: il timeout non coinvolge update-weather.yml.
          # Nessun token o errore HTTP contenente URL di accesso viene scritto nei JSON pubblici.
          rm -f /tmp/mtg-li-stage.txt
          if timeout --signal=TERM --kill-after=5s 55s python -u lightning_mtg_li.py --output lightning_mtg_li.json; then
            echo "Collector MTG-LI concluso"
          else
            exit_code=$?
            phase=$(cat /tmp/mtg-li-stage.txt 2>/dev/null || printf 'unknown')
            case "$phase" in
              start|authentication|collection|search|download|decode|complete) ;;
              *) phase=unknown ;;
            esac
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              state=timeout
            else
              state=unavailable
            fi
            echo "::warning::MTG-LI state=$state phase=$phase (nessun dato utilizzato nel nowcasting)"
            python lightning_mtg_li.py --output lightning_mtg_li.json --mark-unavailable "$state" --phase "$phase"
          fi
      - name: Salva snapshot MTG-LI senza modificare la pipeline meteo
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        run: |
          git config user.name "meteo-giammoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lightning_mtg_li.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo snapshot"
            exit 0
          fi
          git commit -m "Aggiorna snapshot satellitare MTG-LI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Snapshot MTG-LI persistito"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::Conflitto aggiornamento MTG-LI; il workflow meteo resta indipendente"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::warning::Persistenza MTG-LI non riuscita"
          exit 0
