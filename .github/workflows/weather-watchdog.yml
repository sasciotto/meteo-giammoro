name: Watchdog Meteo Giammoro

on:
  workflow_dispatch:
  schedule:
    - cron: "8-59/10 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Controlla freschezza data.json
        id: freshness
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          raw=(data.get('meta') or {}).get('last_check_iso')
          stale=True
          age=9999
          if raw:
              try:
                  dt=datetime.fromisoformat(raw)
                  if dt.tzinfo is None:
                      dt=dt.replace(tzinfo=timezone.utc)
                  age=max(0,int((datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60))
                  stale=age>=15
              except Exception:
                  pass
          print(f"age_minutes={age}")
          print(f"stale={'true' if stale else 'false'}")
          PY

      - name: Mostra stato
        run: echo "Età data.json = ${{ steps.freshness.outputs.age_minutes }} minuti"

      - name: Controlla se un aggiornamento è già attivo
        id: active
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.parse
          import urllib.request

          token=os.environ['GH_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          workflow='update-weather.yml'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'meteo-giammoro-watchdog',
          }
          active=False
          try:
              for status in ('in_progress','queued'):
                  query=urllib.parse.urlencode({'status':status,'per_page':1})
                  url=f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{query}'
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as response:
                      payload=json.loads(response.read().decode('utf-8'))
                  if int(payload.get('total_count') or 0)>0:
                      active=True
                      break
          except Exception as exc:
              print(f'::warning::Impossibile verificare run attivi: {exc}')
              active=True
          print(f"active={'true' if active else 'false'}")
          PY

      - name: Rilancia aggiornamento se obsoleto e inattivo
        if: steps.freshness.outputs.stale == 'true' && steps.active.outputs.active == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-weather.yml/dispatches \
            -d '{"ref":"main"}'

# Watchdog interno: sfalsato di 5 minuti rispetto al ciclo principale.
# Watchdog esterno: può richiamare questo stesso workflow via workflow_dispatch ogni 10 minuti.
# Se data.json raggiunge 15 minuti di età, il watchdog rilancia il principale solo se non è già attivo.
